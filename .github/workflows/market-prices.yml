name: FC 27 market prices
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_market_prices.py, .github/workflows/market-prices.yml]
permissions:
  contents: write
concurrency:
  group: market-prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public FC 27 prices
        run: python3 scripts/update_market_prices.py --metadata-batches 6
      - name: Commit refreshed prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-prices.json data/market-cards.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh FC 27 console and PC market prices"
          git pull --rebase origin main
          git push origin HEAD:main
