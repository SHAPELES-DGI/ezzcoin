name: FC 27 market prices
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/desk.py, scripts/weekly_recap.py, scripts/site_page.py, scripts/prerender_home.py, scripts/update_market_prices.py, scripts/card_catalog.py, scripts/futbin_prices.py, scripts/update_sbcs.py, scripts/sync_home_prices.py, scripts/market_extras.py, scripts/update_builders.py, scripts/record_price_history.py, scripts/public_page_data.py, tools-core.js, .github/workflows/market-prices.yml]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-prices-v2
  queue: max
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The 6 MB card metadata cache and the hourly price snapshots live in the Actions cache, not in git,
      # so they don't grow the repository on every run.
      - name: Restore market caches
        uses: actions/cache/restore@v4
        with:
          path: |
            data/card-metadata.json
            data/.cache
          key: market-cache-${{ github.run_id }}
          restore-keys: market-cache-
      - name: Seed card metadata if the cache is empty
        run: |
          if [ ! -s data/card-metadata.json ]; then
            curl -fsSL "https://raw.githubusercontent.com/SHAPELES-DGI/ezzcoin/b49d74fca57a9e6c9af18435f4032f8df12c702d/data/card-metadata.json" -o data/card-metadata.json || rm -f data/card-metadata.json
          fi
      - name: Validate exact card discovery
        run: |
          python3 scripts/test_card_catalog.py
          python3 scripts/test_futbin_prices.py
          node scripts/test_home_prices.cjs
          node scripts/test_market_sync.cjs
          node scripts/test_builders.cjs
          python3 scripts/test_home_sync.py
          python3 scripts/test_baked_prices.py
          python3 scripts/test_desk.py
          (cd scripts && python3 test_price_history.py)
          python3 scripts/test_weekly_recap.py
      - name: Discover FC 27 cards, prices and matching artwork
        run: python3 scripts/update_market_prices.py --metadata-batches 16
      - name: Refresh active SBCs and solution costs
        run: python3 scripts/update_sbcs.py
        continue-on-error: true
      - name: Refresh Evolution rules and SBC item metadata
        run: python3 scripts/update_builders.py --batches 6 --details 12 --min-age 3600
        continue-on-error: true
      - name: Retain recorded player prices
        run: python3 scripts/record_price_history.py
      - name: Sync Home and trading prices
        run: python3 scripts/sync_home_prices.py
      - name: Market index, trending cards and cheapest cards by rating
        run: python3 scripts/market_extras.py
        continue-on-error: true
      - name: Market read, trade calls and their grading (automatic desk)
        run: python3 scripts/desk.py
        continue-on-error: true
      - name: Weekly market recap (this week so far, and each finished week once)
        run: python3 scripts/weekly_recap.py .
        continue-on-error: true
      - name: Write the latest market read into the home page for search engines
        run: python3 scripts/prerender_home.py .
        continue-on-error: true
      - name: Save market caches
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/card-metadata.json
            data/.cache
          key: market-cache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Rebuild player pages for newly discovered cards
        run: python3 scripts/build_pages.py .
      - name: Commit refreshed prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evolutions.json data/builder-items.json data/price-history index.html data/history.json data/ledger.json data/legends.json data/sbcsolutions.json data/snapshot.json data/prices.json data/topprices.json data/trending.json data/players.json data/live-prices.json data/market-cards.json data/futbin-prices.json data/market.json data/cheapest.json data/market-index.json data/ut-positions.json data/newcards.json data/card-ids.json data/card-renders.json data/day-ago.json p recap sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh FC 27 cards, artwork, player pages and market prices"
            # Another data/page workflow can push between fetch and push.
            # These conflicts concern generated snapshots; keep this refresh.
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
            done
            test "$pushed" = true
          fi
      # Pushes made with GITHUB_TOKEN do not start another Actions workflow.
      # Publish in this job so new card pages/artwork never wait for a manual push.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish refreshed site
        id: deployment
        uses: actions/deploy-pages@v4

