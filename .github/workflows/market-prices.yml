name: FC 27 market prices
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_market_prices.py, scripts/card_catalog.py, scripts/futbin_prices.py, scripts/update_sbcs.py, scripts/sync_home_prices.py, .github/workflows/market-prices.yml]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-prices-v2
  queue: max
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact card discovery
        run: |
          python3 scripts/test_card_catalog.py
          python3 scripts/test_futbin_prices.py
          node scripts/test_home_prices.cjs
          node scripts/test_market_sync.cjs
          python3 scripts/test_home_sync.py
      - name: Discover FC 27 cards, prices and matching artwork
        run: python3 scripts/update_market_prices.py --metadata-batches 16
      - name: Refresh active SBCs and solution costs
        run: python3 scripts/update_sbcs.py
        continue-on-error: true
      - name: Sync Home and trading prices
        run: python3 scripts/sync_home_prices.py
      - name: Rebuild player pages for newly discovered cards
        run: python3 scripts/build_pages.py .
      - name: Commit refreshed prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/legends.json data/sbcsolutions.json data/snapshot.json data/prices.json data/topprices.json data/trending.json data/players.json data/live-prices.json data/market-cards.json data/card-metadata.json data/futbin-prices.json data/newcards.json data/card-ids.json data/card-renders.json p sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh FC 27 cards, artwork, player pages and market prices"
            # Another data/page workflow can push between fetch and push.
            # These conflicts concern generated snapshots; keep this refresh.
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
            done
            test "$pushed" = true
          fi
      # Pushes made with GITHUB_TOKEN do not start another Actions workflow.
      # Publish in this job so new card pages/artwork never wait for a manual push.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish refreshed site
        id: deployment
        uses: actions/deploy-pages@v4

