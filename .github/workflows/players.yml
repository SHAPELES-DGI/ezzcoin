name: Player database
# Rebuilds data/players.json from EA's official FC 27 ratings once a day (this used to be done by the
# hourly Claude task). The script writes the file only if every check passes.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: player-database
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download EA's FC 27 ratings and check them
        id: build
        run: |
          set -o pipefail
          python3 scripts/build_players.py data/players.json | tee "$RUNNER_TEMP/players.log"
          echo "summary=$(tail -1 "$RUNNER_TEMP/players.log")" >> "$GITHUB_OUTPUT"
      - name: Commit the new player database
        env:
          SUMMARY: ${{ steps.build.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          stamp=$(python3 -c "import json;print(json.load(open('data/players.json')).get('updatedAt',''))")
          count=$(python3 -c "import json;print(len(json.load(open('data/players.json'))['rows']))")
          git commit -q -m "Players update $stamp ($count players)" -m "$SUMMARY"
          for i in 1 2 3 4; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 7))
          done
          exit 1
