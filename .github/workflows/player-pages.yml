name: Player pages
on:
  push:
    branches: [main]
    paths: [data/players.json, data/newcards.json, data/legends.json, scripts/build_pages.py, scripts/fetch_card_art.py, scripts/chem.min.js, scripts/meta.py, flags/codes.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: player-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and commit player pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other jobs (prices, photos) may push meanwhile: always build on top of the newest main, and retry.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/fetch_card_art.py .
            python3 scripts/build_pages.py .
            git add -A p sitemap.xml data/card-art.json data/playstyles.json
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -q -m "Rebuild player pages"
            git push origin HEAD:main && exit 0
            sleep $((i * 7))
          done
          exit 1
