name: Player pages
on:
  push:
    branches: [main]
    paths: [data/players.json, scripts/build_pages.py, flags/codes.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: player-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build player pages
        run: python3 scripts/build_pages.py .
      - name: Commit changes
        run: |
          git add -A p sitemap.xml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild player pages"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
